<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontrol Staf Pondok</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{background:#16324f;color:#fff;padding:18px}header h2{margin:0 0 4px}main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px #0001}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #d6dce1}button{font-weight:700;cursor:pointer}.primary{background:#1f7a5a;color:#fff}.login{max-width:420px;margin:12vh auto}.field{display:grid;gap:5px;margin:10px 0}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.person{border:1px solid #e1e6ea;border-radius:13px;padding:13px}.progress{height:10px;background:#e4e8eb;border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:#1f7a5a}.pct{font-size:24px;font-weight:800}.task{display:flex;gap:11px;padding:13px 2px;border-bottom:1px solid #edf0f2}.task input{width:23px;height:23px}.done b{text-decoration:line-through;opacity:.5}.meta{display:block;font-size:12px;color:#66727d;margin-top:3px}.ok{color:#146c43}.pending{color:#a51d16;font-weight:700}.error{color:#b42318}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf2f5;font-size:12px;margin-left:6px}
</style></head><body>
<header><h2>Board Kontrol Staf Pondok</h2><div style="opacity:.8;font-size:12px">Online • Pimpinan & Staf</div></header>
<main>
<section id="login" class="card login"><h2>Login</h2><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" style="width:100%" onclick="login()">Masuk</button><p id="err" class="error"></p></section>
<section id="app" class="hidden"><div class="card topbar"><div><b id="who"></b><span id="roleBadge" class="badge"></span></div><button onclick="logout()">Keluar</button></div><div id="content"></div></section>
</main>
<script>
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let sessionUser=null;
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function login(){err.textContent='';const u=username.value.trim(),p=password.value;if(!u||!p){err.textContent='Isi username dan password.';return}const r=await client.auth.signInWithPassword({email:u.includes('@')?u:u+'@kontrol.local',password:p});if(r.error){err.textContent='Login gagal: '+r.error.message';return}sessionUser=r.data.user;await start();}
async function start(){const r=await client.from('profiles').select('id,name,role').eq('id',sessionUser.id).single();if(r.error||!r.data){err.textContent='Profil belum dibuat.';await client.auth.signOut();return}login.classList.add('hidden');app.classList.remove('hidden');who.textContent=r.data.name;roleBadge.textContent=r.data.role==='admin'?'PIMPINAN':'STAFF';await render(r.data);}
async function prepare(){await client.rpc('prepare_daily_checklist',{p_work_date:today()});}
async function render(profile){await prepare();if(profile.role==='admin')return admin();return staff(profile);}
async function staff(profile){const d=today();const t=await client.from('task_templates').select('task_no,task_name').eq('staff_id',sessionUser.id).eq('active',true).eq('frequency','daily').order('task_no');if(t.error){content.innerHTML='<div class="card error">Gagal membaca tugas.</div>';return}const c=await client.from('checklists').select('task_no,done,completed_at').eq('staff_id',sessionUser.id).eq('work_date',d);if(c.error){content.innerHTML='<div class="card error">Gagal membaca checklist.</div>';return}const map={};(c.data||[]).forEach(x=>map[x.task_no]=x);const list=t.data||[],done=list.filter(x=>map[x.task_no]?.done).length,p=Math.round(done/list.length*100)||0;content.innerHTML='<div class="card"><h2>'+esc(profile.name)+'</h2><div>'+done+'/'+list.length+' tugas harian selesai • <b>'+p+'%</b></div><div class="progress"><div class="fill" style="width:'+p+'%"></div></div></div><div class="card"><h3>Checklist Hari Ini</h3>'+(list.length?list.map(x=>{const y=map[x.task_no];return '<label class="task '+(y?.done?'done':'')+'"><input type="checkbox" '+(y?.done?'checked':'')+' onchange="toggle('+x.task_no+',this.checked)"><span><b>'+x.task_no+'. '+esc(x.task_name)+'</b><span class="meta '+(y?.done?'ok':'pending')+'">'+(y?.done?'✓ Selesai':'Belum dikerjakan')+'</span></span></label>'}).join(''):'Belum ada tugas harian aktif.')+'</div>';}
async function toggle(n,v){const r=await client.from('checklists').upsert({staff_id:sessionUser.id,work_date:today(),task_no:n,done:v,completed_at:v?new Date().toISOString():null},{onConflict:'staff_id,work_date,task_no'});if(r.error){alert('Gagal menyimpan: '+r.error.message);return}const p=await client.from('profiles').select('id,name,role').eq('id',sessionUser.id).single();await render(p.data);}
async function admin(){const d=today();const p=await client.from('profiles').select('id,name').eq('role','staff').order('name');const t=await client.from('task_templates').select('staff_id,task_no,task_name').eq('active',true).eq('frequency','daily').order('task_no');const c=await client.from('checklists').select('staff_id,task_no,done').eq('work_date',d);if(p.error||t.error||c.error){content.innerHTML='<div class="card error">Gagal membaca data dashboard.</div>';return}const by={},ts={};(c.data||[]).forEach(x=>(by[x.staff_id]??={})[x.task_no]=x);(t.data||[]).forEach(x=>(ts[x.staff_id]??=[]).push(x));let td=0,tt=0;const cards=p.data.map(x=>{const l=ts[x.id]||[],m=by[x.id]||{},dn=l.filter(q=>m[q.task_no]?.done).length,pc=Math.round(dn/l.length*100)||0;td+=dn;tt+=l.length;return '<div class="person"><b>'+esc(x.name)+'</b><div class="pct">'+pc+'%</div><div class="meta">'+dn+'/'+l.length+' tugas selesai</div><div class="progress"><div class="fill" style="width:'+pc+'%"></div></div></div>'}).join('');const pending=p.data.map(x=>{const l=(ts[x.id]||[]).filter(q=>!by[x.id]?.[q.task_no]?.done);return l.length?'<div style="margin:12px 0"><b>'+esc(x.name)+' — '+l.length+' belum selesai</b>'+l.map(q=>'<div class="meta pending">☐ '+q.task_no+'. '+esc(q.task_name)+'</div>').join('')+'</div>':''}).join('')||'<div class="ok">Semua tugas harian selesai. Alhamdulillah.</div>';const overall=Math.round(td/tt*100)||0;content.innerHTML='<div class="card"><h2>Dashboard Pimpinan</h2><div><b>'+td+'/'+tt+'</b> tugas selesai hari ini • <b>'+overall+'%</b></div><div class="progress"><div class="fill" style="width:'+overall+'%"></div></div></div><div class="card"><h3>Progress Staf</h3><div class="grid">'+cards+'</div></div><div class="card"><h3>⚠️ Belum Selesai Hari Ini</h3>'+pending+'</div>';}
async function logout(){await client.auth.signOut();location.reload();}(async()=>{const r=await client.auth.getSession();if(r.data.session){sessionUser=r.data.session.user;await start();}})();
</script></body></html>
